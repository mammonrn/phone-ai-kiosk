# /etc/nginx/sites-available/kiosk
#
# A separate file with its own server_name. Nothing in here touches the
# thaitrack or monthreport vhosts, and nginx picks between them by server_name
# alone.
#
# limit_req_zone has to live in the http context, which is where sites-enabled
# files are included, so it sits here above the server blocks rather than in
# nginx.conf — that keeps this whole change to one new file.
limit_req_zone $binary_remote_addr zone=kiosk_chat:1m rate=30r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kiosk.xn--l3cgts1b3bzcvf.com;

    ssl_certificate     /etc/letsencrypt/live/kiosk.xn--l3cgts1b3bzcvf.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kiosk.xn--l3cgts1b3bzcvf.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Smaller than the broker's own 8 KiB cap, so a flood of large bodies is
    # refused here rather than read into Python first.
    client_max_body_size 16k;
    client_body_timeout  10s;

    # The kiosk sends one short question at a time. Anything that looks like
    # scraping or brute force is slowed down before it reaches the broker,
    # which is also what keeps the per-token limit from being the only defence.
    limit_req zone=kiosk_chat burst=10 nodelay;
    limit_req_status 429;

    # Only the two routes that exist. Everything else never reaches the broker.
    location = /v1/chat {
        proxy_pass http://127.0.0.1:8770;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A model call takes seconds, not milliseconds.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8770;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name kiosk.xn--l3cgts1b3bzcvf.com;

    # Certificate renewal keeps working over plain HTTP; everything else is
    # pushed to TLS. The device token must never travel unencrypted, so this
    # redirect is not optional.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
