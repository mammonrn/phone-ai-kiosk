# /etc/nginx/sites-available/kiosk
#
# A separate file with its own server_name. Nothing in here touches the
# thaitrack or monthreport vhosts, and nginx picks between them by server_name
# alone.
#
# limit_req_zone has to live in the http context, which is where sites-enabled
# files are included, so it sits here above the server blocks rather than in
# nginx.conf — that keeps this whole change to one new file.
#
# THE RULE THIS FILE FOLLOWS: every limit here is looser than the broker's own,
# so the broker is what refuses a request and the phone gets its Thai JSON
# error. nginx refusing first means an HTML 413 the kiosk cannot read out loud —
# which is exactly what happened to /v1/stt in versionCode 5: a 116 KB recording
# hit a 16k server-wide body cap and never reached Python, and the earlier
# testing had gone straight to 127.0.0.1 and never seen it.
#
# Rate: one spoken question is THREE requests (/v1/stt, /v1/chat, /v1/tts). The
# broker allows 10 a minute per endpoint, so 30 a minute is normal traffic.
# 90r/m with a burst of 30 leaves the broker's per-token limit as the one that
# binds, while still stopping a flood at the door.
limit_req_zone $binary_remote_addr zone=kiosk_chat:1m rate=90r/m;

# WHERE THE TIME GOES. Also http-context only, so it sits up here beside the rate
# zone. This is the middle layer of the measurement: the phone reports what it
# saw, the broker reports what it spent, and this reports what nginx saw in
# between, which is the only way to tell a slow vendor from a slow network.
#
#   $request_time          everything, from the first byte read off the socket to
#                          the last byte written back to the phone
#   $upstream_header_time  until the broker's response headers arrived — the
#                          broker's own share, and the number to compare against
#                          the broker's handler_ms
#   $upstream_response_time  until the broker's last byte arrived
#   $request_time - $upstream_response_time  what nginx itself added
#
# $uri and not $request: $uri is the normalised path with no query string on it.
# Nothing here logs a header, so the bearer token cannot reach this file.
log_format kiosk_timing '$time_iso8601 $status $request_method $uri '
                        'in=$request_length out=$body_bytes_sent '
                        'request=$request_time upstream_header=$upstream_header_time '
                        'upstream_all=$upstream_response_time connect=$upstream_connect_time';

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kiosk.xn--l3cgts1b3bzcvf.com;

    ssl_certificate     /etc/letsencrypt/live/kiosk.xn--l3cgts1b3bzcvf.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kiosk.xn--l3cgts1b3bzcvf.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # The default for anything that is not audio. Each location below sets its
    # own; this is the floor for a path that somehow reaches the server block
    # without one.
    client_max_body_size 16k;
    client_body_timeout  10s;

    limit_req zone=kiosk_chat burst=30 nodelay;
    limit_req_status 429;

    # Its own file, and only for this server block: the thaitrack and monthreport
    # vhosts keep the log they have always had.
    access_log /var/log/nginx/kiosk-timing.log kiosk_timing;

    # Only the routes that exist. Everything else never reaches the broker.

    # Audio. The broker caps this at 1 MiB (config: max_audio_bytes); 1200k
    # leaves ~180 KB of margin so an over-long recording is refused by the
    # broker, in Thai, rather than by nginx in HTML.
    location = /v1/stt {
        client_max_body_size 1200k;
        # Uploading a megabyte over a home connection is not instant, and a body
        # timeout that fires mid-upload looks exactly like a broken server.
        client_body_timeout 30s;

        proxy_pass http://127.0.0.1:8770;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Upload, then transcription. Both are seconds.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # One short question. The broker caps the body at 8 KiB.
    # The kiosk screen. A GET that reads and changes nothing, so the phone can
    # retry it freely — and the broker caches every source, so a phone polling
    # this hard reaches the broker and stops there rather than reaching five
    # outside APIs. No body to speak of; the floor applies.
    #
    # THIS ROUTE'S QUERY STRING CARRIES THE PHONE'S COARSE POSITION —
    # ?lat=20.05&lon=99.89, rounded to about a kilometre by the phone and
    # rounded again by the broker. Two things above keep it out of the files on
    # this machine and both are load-bearing:
    #
    #   * kiosk_timing logs $uri, which is the normalised path WITHOUT the
    #     query string. Changing it to $request or $request_uri would start
    #     writing Poom's position to disk every minute.
    #   * `location =` matches on the path alone, so the exact match still
    #     works, and `proxy_pass` with no URI part forwards the query string
    #     unchanged, which is what the broker needs.
    location = /v1/dashboard {
        client_max_body_size 1k;

        proxy_pass http://127.0.0.1:8770;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Three outside sources with a six-second timeout each, worst case in
        # series on a cold cache. Comfortably above that, and the broker gives
        # up long before nginx does.
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # THE ERROR LOG IS THE OTHER WAY OUT. Unlike kiosk_timing it has no
        # format to choose: every line nginx writes there for a request ends in
        # `request: "GET /v1/dashboard?lat=..&lon=.. HTTP/1.1"`. That happens
        # on "connect() failed" every time the broker restarts, on "upstream
        # timed out", and on every limit_req refusal — so a deploy would have
        # written the position into /var/log/nginx/error.log. This route alone
        # logs nowhere; the broker's own journal says why a dashboard failed,
        # and the same broker going down still shows up in the error log from
        # every other route.
        error_log /dev/null;
    }

    location = /v1/chat {
        client_max_body_size 16k;

        proxy_pass http://127.0.0.1:8770;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A model call takes seconds, not milliseconds.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # One short reply in, audio out. Same 8 KiB body cap in the broker.
    location = /v1/tts {
        client_max_body_size 16k;

        proxy_pass http://127.0.0.1:8770;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Synthesis is quicker than a model call, and the broker gives up at 20s
        # on its own.
        proxy_read_timeout 40s;
        proxy_send_timeout 40s;
        # The response is audio, so it is the one thing worth streaming back
        # rather than buffering whole.
        proxy_buffering off;
    }

    # Phase 6: the phone's 15-minute soak sample. Numbers only, tiny.
    location = /v1/health {
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8770;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Round 2A. The phone asks for two minutes of private access after its
    # identity check; a small JSON body, like /v1/chat.
    location = /v1/auth/grant {
        client_max_body_size 1k;
        proxy_pass http://127.0.0.1:8770;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Where Google sends Poom's browser after the consent screen. GET only.
    # The query string carries a one-time code and state: this server block
    # logs $uri (no query string), and the broker cuts it from its own log.
    location = /oauth/google/callback {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8770;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8770;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name kiosk.xn--l3cgts1b3bzcvf.com;

    # Certificate renewal keeps working over plain HTTP; everything else is
    # pushed to TLS. The device token must never travel unencrypted, so this
    # redirect is not optional.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
