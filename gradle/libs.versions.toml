[versions]
# Same toolchain versions as mammonrn/tracktrip, which builds green in CI.
agp = "9.3.1"
coreKtx = "1.19.0"
junit = "4.13.2"
# The on-phone UI walk (scripts/ui-check, 0.63.0): androidTest ONLY — none of it
# reaches the app's APK; it is its own test APK, built by CI beside the app.
androidxTestRunner = "1.7.0"
androidxTestCore = "1.7.0"
androidxTestExtJunit = "1.3.0"
uiautomator = "2.3.0"
atf = "4.1.1"
# org.json for JVM unit tests ONLY. On the phone this class comes from
# Android itself; in a unit test the android.jar stub throws "not mocked",
# so the parser DashboardState uses could not be tested at all without a
# real implementation on the test classpath. It never ships in the APK.
json = "20260814"
# Same version for the Android runtime and the JVM one used by the parity
# test, so the test and the phone run the identical kernels.
#
# PINNED FOR SIZE, and the size is the whole reason this number is not "latest".
# Measured, arm64-v8a native libraries only:
#     1.17.3 -> 16.0 MB    1.22.0 -> 17.5 MB
#     1.19.2 -> 17.6 MB    1.26.0 -> 26.2 MB
#     1.20.0 -> 17.6 MB    1.30.0 -> 31.6 MB
# Poom approved roughly +17.7 MB of APK. 1.30.0 would have been +31.6 MB — near
# double the agreed figure, for a runtime whose extra megabytes are operators
# and execution providers three small models do not touch. 1.22.0 lands on the
# number that was actually agreed.
onnxruntime = "1.22.0"
# The identity check (0.37.0). CameraX for the front camera, ML Kit's BUNDLED
# face detector (about +6.9 MB, per its docs) so it works with no download and
# no Play services step first. The face model itself (SFace) runs on the ONNX
# Runtime above. See NOTICE.
camerax = "1.4.2"
# LibVLC's Java side needs these (0.60.0); pinned at what CameraX already brings, so nothing moves.
lifecycleLivedata = "2.6.2"
androidxAnnotation = "1.10.0"
mlkitFace = "16.1.7"
# The file manager's NAS, read only (0.44.0). SMB 2/3 in pure Java, Apache-2.0,
# no native code. It brings BouncyCastle for the SMB crypto Android's JCE does
# not have (MD4 for NTLM, AES-CMAC for SMB 3 signing). See NOTICE.
smbj = "0.14.0"
# The music player (0.53.0), and the video player after it. ExoPlayer only —
# not media3-session or media3-ui (the kiosk draws its own screens and
# notification) and NO decoder extension: every format Poom chose (FLAC,
# ALAC, WAV, MP3, AAC, Opus) is decoded by Android's own MediaCodec. The
# ffmpeg extension (DSD, APE, WavPack) is the ~22 MB Poom ruled out.
media3 = "1.11.1"
# Google Drive straight from the phone (0.61.0, Poom): Google Identity Services'
# AuthorizationClient only, for a Drive access token. No client id is compiled
# in (the Android OAuth client is matched by package name + SHA-1) and no
# google-api-client: the Drive REST calls are plain HttpURLConnection + org.json.
playServicesAuth = "22.0.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
json = { group = "org.json", name = "json", version.ref = "json" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
atf = { group = "com.google.android.apps.common.testing.accessibility.framework", name = "accessibility-test-framework", version.ref = "atf" }
onnxruntime-android = { group = "com.microsoft.onnxruntime", name = "onnxruntime-android", version.ref = "onnxruntime" }
onnxruntime-jvm = { group = "com.microsoft.onnxruntime", name = "onnxruntime", version.ref = "onnxruntime" }
camerax-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
camerax-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
androidx-lifecycle-livedata = { group = "androidx.lifecycle", name = "lifecycle-livedata", version.ref = "lifecycleLivedata" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "androidxAnnotation" }
smbj = { group = "com.hierynomus", name = "smbj", version.ref = "smbj" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
play-services-auth = { group = "com.google.android.gms", name = "play-services-auth", version.ref = "playServicesAuth" }
# The radio (0.61.0): Thai stations that stream as HLS (.m3u8), e.g. MCOT's regional ones.
media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
mlkit-face = { group = "com.google.mlkit", name = "face-detection", version.ref = "mlkitFace" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
