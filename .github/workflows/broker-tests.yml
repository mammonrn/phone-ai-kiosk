name: Broker tests

# The broker's tests need no API key, no network and no VPS — so there is no
# reason for them to only ever run on someone's laptop.

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/broker-tests.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/broker-tests.yml'
  workflow_dispatch:

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Matches the VPS (Ubuntu 24.04 ships 3.12), so a version-specific
          # failure shows up here rather than on the server.
          python-version: '3.12'

      - name: Install dependencies
        working-directory: server
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pytest anthropic
          # The Thai segmenter for the voice, pinned like install.sh installs it.
          python -m pip install --quiet "nlpo3==1.4.0"
          # AES-GCM for the Google token (vault.py), as install.sh installs it.
          python -m pip install --quiet "cryptography>=42"

      # pytest only compiles what the tests import. __main__.py — the file
      # systemd actually runs — was imported by none of them, so on 2026-09-23 a
      # syntax error in it passed CI and took production down in a restart
      # loop. These two steps are the gate that was missing.
      - name: Every Python file compiles
        working-directory: server
        run: python -m compileall -q -f kiosk_broker tests

      - name: The broker starts and answers /healthz
        working-directory: server
        env:
          # A placeholder, never used for a request: the smoke test only asks
          # /healthz, and building the Anthropic client makes no call.
          ANTHROPIC_API_KEY: ci-placeholder-not-a-key
        run: |
          home="$(mktemp -d)"
          cp pricing.json stt_hints.json pronunciation.json tts_words.txt "$home/"
          echo '{"port": 18770}' > "$home/config.json"
          export KIOSK_BROKER_HOME="$home"
          python -m kiosk_broker --help > /dev/null
          python -m kiosk_broker keys
          python -m kiosk_broker analysis status
          python -m kiosk_broker stt-hints-check
          # The Thai segmenter, through the shipped files: must be available and
          # must keep the word the voice once split ("แผนที่") whole.
          python -m kiosk_broker segment-check "กำลังเปิดแผนที่ไปบิ๊กซีครับ" | tee "$home/segment.txt"
          grep -q "voice gets : กำลังเปิด แผนที่ ไปบิ๊กซีครับ" "$home/segment.txt"             || { echo "segment-check did not produce the expected voice text"; exit 1; }
          python -m kiosk_broker serve > "$home/serve.log" 2>&1 &
          pid=$!
          up=""
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18770/healthz; then echo; up=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then echo "broker exited:"; cat "$home/serve.log"; exit 1; fi
            sleep 1
          done
          if [ -z "$up" ]; then echo "no answer from /healthz within 30 s:"; cat "$home/serve.log"; kill "$pid"; exit 1; fi

          # THE ALARM PATH, THROUGH THE RUNNING SERVER. On 2026-09-23 a polite
          # "ตั้งปลุก 11 โมงเช้าได้ไหมครับ" reached the model on production and
          # nothing failed in CI, because nothing sent a spoken command through
          # the process systemd runs. This does: a throwaway device in this
          # throwaway home, a real POST /v1/chat, and the answer must be the
          # set_alarm action decided in code — the placeholder key above means
          # a request that reached the model would fail, not pass.
          # The token is never echoed.
          token="$(python -m kiosk_broker issue-token ci-smoke | sed -n 's/^token : //p')"
          # The last is how the transcriber actually wrote it on the A07
          # ("ตั้งปลูก" — one tone mark off); it must still be the command.
          for phrase in "ตั้งปลุก 11 โมงเช้าได้ไหมครับ" "ปลุกตีห้า" "ตั้งปลุกหกโมงครึ่ง ไปทำงาน" "ตั้งปลูก 11 โมงเช้า"; do
            body="$(python -c 'import json,sys; print(json.dumps({"text": sys.argv[1]}))' "$phrase")"
            answer="$(curl -sS -X POST http://127.0.0.1:18770/v1/chat \
                      -H "Authorization: Bearer $token" \
                      -H 'Content-Type: application/json; charset=utf-8' --data "$body")"
            echo "$answer" | python -c 'import json,sys; a=json.load(sys.stdin); t=(a.get("action") or {}).get("type"); print("action:", t); sys.exit(0 if t == "set_alarm" else 1)' \
              || { echo "the alarm command did not become set_alarm:"; echo "$answer"; cat "$home/serve.log"; kill "$pid"; exit 1; }
          done
          # THE CALENDAR PATH, as the transcriber actually wrote it on the A07
          # ("นัก" for "นัด", 2026-09-23): with no grant it must come back as
          # verify_identity, decided in code — the placeholder key means a
          # request that reached the model would fail instead.
          body="$(python -c 'import json,sys; print(json.dumps({"text": sys.argv[1]}))' "วันนี้มีนักอะไรบ้าง")"
          answer="$(curl -sS -X POST http://127.0.0.1:18770/v1/chat -H "Authorization: Bearer $token"                     -H 'Content-Type: application/json; charset=utf-8' --data "$body")"
          echo "$answer" | python -c 'import json,sys; a=json.load(sys.stdin); t=(a.get("action") or {}).get("type"); print("action:", t); sys.exit(0 if t == "verify_identity" else 1)'             || { echo "the calendar question did not ask for the identity check:"; echo "$answer"; cat "$home/serve.log"; kill "$pid"; exit 1; }
          grep -q "calendar=yes calendar_reason=misheard:" "$home/serve.log"             || { echo "the intent log does not show the calendar check:"; cat "$home/serve.log"; kill "$pid"; exit 1; }
          grep -q "alarm=yes alarm_reason=set calendar=no calendar_reason=no-calendar-word maps=skipped maps_word=no" "$home/serve.log" \
            || { echo "the intent log does not show the alarm and map checks:"; cat "$home/serve.log"; kill "$pid"; exit 1; }
          # Round 2A routes, through the running server: a grant with no token
          # is refused, and a callback with a made-up state is refused politely.
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18770/v1/auth/grant -d '{}')"
          [ "$code" = "401" ] || { echo "/v1/auth/grant without a token answered $code"; cat "$home/serve.log"; kill "$pid"; exit 1; }
          code="$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:18770/oauth/google/callback?state=made-up&code=x')"
          [ "$code" = "400" ] || { echo "the Google callback answered $code to a made-up state"; cat "$home/serve.log"; kill "$pid"; exit 1; }
          if grep -q "made-up" "$home/serve.log"; then echo "the callback's query string reached the log"; kill "$pid"; exit 1; fi
          grep -q "wordcut ready" "$home/serve.log"             || { echo "the Thai segmenter did not load in the running broker:"; cat "$home/serve.log"; kill "$pid"; exit 1; }
          kill "$pid"

      - name: Run tests
        working-directory: server
        run: python -m pytest tests/ -q

      - name: Check every rate in the pricing file has provenance
        working-directory: server
        # Not a price check against the live pages — that would make the build
        # depend on a web fetch. It checks that every section carries a source
        # and a check date, so a rate can never be edited in without saying
        # where it came from. Three services now share one budget, so all three
        # have to answer for their numbers.
        run: |
          python - <<'PY'
          import json, sys

          EXPECTED_HOSTS = {
              "models": "https://platform.claude.com/",
              "stt": "https://console.groq.com/",
              "tts": "https://cloud.google.com/",
              "stt_google": "https://cloud.google.com/speech-to-text/",
          }

          data = json.load(open("pricing.json"))
          problems = []

          for section, host in EXPECTED_HOSTS.items():
              block = data.get(section)
              if not isinstance(block, dict):
                  problems.append(f"{section}: section missing")
                  continue
              for key in ("_source", "_checked_at"):
                  if not block.get(key):
                      problems.append(f"{section}: {key} missing — a rate with no provenance")
              source = block.get("_source", "")
              if source and not source.startswith(host):
                  problems.append(f"{section}: _source should point at {host}, got {source}")
              if not any(not k.startswith("_") for k in block):
                  problems.append(f"{section}: carries no actual rates")

          if problems:
              sys.exit("\n".join(problems))

          for section in EXPECTED_HOSTS:
              block = data[section]
              rates = [k for k in block if not k.startswith("_")]
              print(f"{section:<7} {block['_source']}  checked {block['_checked_at']}  ({', '.join(rates)})")
          PY
