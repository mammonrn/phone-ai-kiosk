name: Build Android APK

# Structure taken from mammonrn/tracktrip's build-apk.yml, which is already
# green in CI. The debug-keystore steps are deliberately left out: those exist
# there so Google Sign-In gets a stable, registered certificate. Phase 0 signs
# nothing that anybody registers, so AGP's auto-generated debug key is fine.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        # Verifies gradle-wrapper.jar matches a known-good release, so a
        # tampered wrapper can't execute arbitrary code in CI.
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        # Release signing is deliberately not done here: phase 0 has no release
        # keystore, and one that CI could reach is one anybody with push access
        # could sign with.
        run: ./gradlew assembleDebug --stacktrace

      - name: Report APK details
        # Printed on every run so the artifact can be identified without
        # downloading and unpacking it by hand.
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)"
          APK="$(find app/build/outputs/apk/debug -name '*.apk' | head -1)"
          echo "APK: $APK"
          "$AAPT" dump badging "$APK" | head -3
          {
            echo "### Debug APK"
            echo ""
            echo '```'
            "$AAPT" dump badging "$APK" | head -3
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-ai-kiosk-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
