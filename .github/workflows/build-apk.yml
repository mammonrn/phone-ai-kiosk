name: Build Android APK

# Structure taken from mammonrn/tracktrip's build-apk.yml, which is already
# green in CI. The debug-keystore steps are deliberately left out: those exist
# there so Google Sign-In gets a stable, registered certificate. Phase 0 signs
# nothing that anybody registers, so AGP's auto-generated debug key is fine.

# ONLY WHEN THE APP CAN HAVE CHANGED (Poom, 2026-09-23: the account is GitHub
# Free with no card, so running out of Actions minutes blocks CI until the
# 1st). A commit that touches only the broker, the docs or DESIGN.md builds
# nothing here; broker-tests.yml covers server/**. workflow_dispatch stays, so
# an APK can always be built by hand from the Actions tab.
on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    # actions: write lets the last step delete the older APK artifacts with
    # this run's own token; nothing else is granted.
    permissions:
      contents: read
      actions: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        # Verifies gradle-wrapper.jar matches a known-good release, so a
        # tampered wrapper can't execute arbitrary code in CI.
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        # v4, not the v3 tracktrip pins: v3 installs the obsolete `tools`
        # package by default, which Google has since removed from the SDK
        # repository, so every v3 run now dies with "Failed to find package
        # 'tools'". v4 defaults to platform-tools only.
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode debug keystore
        id: debug_keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        # Without a pinned keystore AGP generates a throwaway one per runner,
        # so every build is signed with a different certificate. Android
        # refuses to update an installed app whose signature changed, and this
        # app is the Device Owner — it cannot just be uninstalled, so a key
        # change costs a re-provisioning of the phone.
        #
        # The build is still allowed to proceed without the secret (a fork or
        # a PR from one cannot read it), but the run is annotated so an APK
        # that will not install over the last one is obvious from the summary
        # rather than from the phone.
        run: |
          if [ -n "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            if [ ! -s "$RUNNER_TEMP/debug.keystore" ]; then
              echo "::error::ANDROID_DEBUG_KEYSTORE_BASE64 is set but did not decode to a file. Re-generate it with 'base64 -w0' and update the secret."
              exit 1
            fi
            echo "path=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing with the pinned keystore from ANDROID_DEBUG_KEYSTORE_BASE64."
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_DEBUG_KEYSTORE_BASE64 is not set. This APK is signed with a throwaway key and will NOT install over an existing one with 'adb install -r'. Re-provisioning the device owner would be required. See README.md."
          fi

      - name: The broker's address is set
        # 0.63.0: the address is a repository secret, never in the code. An APK built
        # without it could not reach the broker at all, so none is built.
        env:
          KIOSK_BROKER_URL: ${{ secrets.KIOSK_BROKER_URL }}
        run: |
          if [ -z "${KIOSK_BROKER_URL:-}" ]; then
            echo "::error::The KIOSK_BROKER_URL secret is not set (Settings > Secrets > Actions). No APK is built without it."
            exit 1
          fi

      - name: Run unit tests
        # Before the APK, so a broken test stops the build rather than being
        # found after an artifact has been published.
        env:
          KIOSK_BROKER_URL: ${{ secrets.KIOSK_BROKER_URL }}
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Compare screen pictures (Paparazzi)
        # 0.63.0 (Poom): screens that need no real data are drawn on the runner and
        # compared with the pictures in app/src/test/snapshots/images; a screen that
        # changed without meaning to fails here, with the difference in the report.
        # A change that IS meant: `./gradlew recordPaparazziDebug` and commit the pictures.
        env:
          KIOSK_BROKER_URL: ${{ secrets.KIOSK_BROKER_URL }}
        run: ./gradlew verifyPaparazziDebug --stacktrace

      - name: Upload Paparazzi differences
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: paparazzi-differences
          path: app/out/failures
          if-no-files-found: ignore
          retention-days: 7

      - name: Build debug APK
        env:
          # Empty when the secret is absent, which makes build.gradle.kts fall
          # back to AGP's default debug signing.
          DEBUG_KEYSTORE_PATH: ${{ steps.debug_keystore.outputs.path }}
          KIOSK_BROKER_URL: ${{ secrets.KIOSK_BROKER_URL }}
        # Release signing is deliberately not done here: there is no release
        # keystore yet, and one that CI could reach is one anybody with push
        # access could sign with.
        run: ./gradlew assembleDebug --stacktrace

      - name: Report APK details
        # Printed on every run so the artifact can be identified without
        # downloading and unpacking it by hand.
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)"
          APK="$(find app/build/outputs/apk/debug -name '*.apk' | head -1)"
          echo "APK: $APK"
          "$AAPT" dump badging "$APK" | head -3

          # The three things phase 1 can get silently wrong: a debug APK that
          # is not test-only (no way off the device but a factory reset), a
          # missing device admin receiver, and a missing HOME category (no
          # kiosk after reboot). Checked here so a bad APK fails the run
          # rather than being found on the phone.
          MANIFEST="$("$AAPT" dump xmltree "$APK" --file AndroidManifest.xml)"
          fail=0
          check() {
            if grep -q "$2" <<< "$MANIFEST"; then
              echo "ok: $1"
            else
              echo "::error::$1 — not found in the built manifest"
              fail=1
            fi
          }
          check "debug build is testOnly"        'testOnly'
          check "device admin receiver declared" 'KioskDeviceAdminReceiver'
          check "device_admin metadata present"  'android.app.device_admin'
          check "HOME intent category"           'android.intent.category.HOME'
          [ "$fail" -eq 0 ] || exit 1

          # The signing certificate decides whether this APK can be installed
          # over the one already on the phone. Printed every run so a key
          # change is visible here rather than as INSTALL_FAILED_UPDATE_
          # INCOMPATIBLE on the device.
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK" | grep -iE 'DN:|SHA-256 digest' | tee /tmp/certs.txt
          SHA256="$(grep -im1 'SHA-256 digest' /tmp/certs.txt | sed 's/.*: //' | tr -d ' \r')"

          {
            echo "### Debug APK"
            echo ""
            echo '```'
            "$AAPT" dump badging "$APK" | head -3
            echo '```'
            echo ""
            echo "Signing certificate SHA-256: \`$SHA256\`"
            echo ""
            if [ -n "${{ steps.debug_keystore.outputs.path }}" ]; then
              echo "Signed with the **pinned** keystore, so this installs over the previous build with \`adb install -r -t\`."
            else
              echo "⚠️ Signed with a **throwaway** key — this will NOT install over an existing build."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: The wake word must actually be in the APK
        # The detector is useless without its three models, and the native
        # runtime is useless on this phone unless it is the arm64 one. Both are
        # things a build can lose quietly: a moved assets folder, or an
        # abiFilters line dropped in a merge. Checked on the artifact that is
        # about to be published, not on the source that produced it.
        run: |
          set -o pipefail
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "checking $APK"
          LIST=$(unzip -l "$APK")

          # grep reads the list from a here-string, never from `echo | grep -q`:
          # grep -q stops at the first match, echo then dies of SIGPIPE, and
          # pipefail turned a model that WAS there into "MISSING" once the APK
          # listing grew past the pipe buffer (0.37.0, 519 entries).
          fail=0
          # The three wake word models, and SFace for the identity check (0.37.0).
          for model in melspectrogram.onnx embedding_model.onnx hey_jarvis_v0.1.onnx face_recognition_sface_2021dec_int8.onnx; do
            if grep -q "assets/models/$model" <<< "$LIST"; then
              echo "  ok   assets/models/$model"
            else
              echo "  MISSING assets/models/$model"; fail=1
            fi
          done

          if grep -q 'lib/arm64-v8a/libonnxruntime.so' <<< "$LIST"; then
            echo "  ok   lib/arm64-v8a/libonnxruntime.so"
          else
            echo "  MISSING lib/arm64-v8a/libonnxruntime.so"; fail=1
          fi

          # Any other ABI means abiFilters stopped working and the APK just
          # grew by tens of megabytes for architectures this phone cannot run.
          OTHER=$(echo "$LIST" | grep -oE 'lib/[^/]+/' | sort -u | grep -v 'lib/arm64-v8a/' || true)
          if [ -n "$OTHER" ]; then
            echo "  UNEXPECTED ABIs:"; echo "$OTHER"; fail=1
          else
            echo "  ok   arm64-v8a is the only ABI"
          fi

          # PACKAGE VISIBILITY, CHECKED IN THE MERGED MANIFEST.
          #
          # versionCode 9 shipped without a <queries> block and reported Google
          # Maps as not installed on a phone that had it running. The source
          # manifest is checked by PackageVisibilityTest; this checks what
          # actually came out of the manifest merger, which is a different
          # thing and the one the phone reads.
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | tail -1)
          if [ -z "$AAPT" ]; then
            echo "  cannot find aapt2 — unable to check the merged manifest"; fail=1
          else
            TREE=$("$AAPT" dump xmltree "$APK" --file AndroidManifest.xml)
            if grep -q "E: queries" <<< "$TREE"; then
              echo "  ok   merged manifest has a <queries> block"
            else
              echo "  MISSING <queries> in the merged manifest — Maps will be invisible"; fail=1
            fi
            if grep -q 'name.*="com.google.android.apps.maps"' <<< "$TREE"; then
              echo "  ok   com.google.android.apps.maps is declared visible"
            else
              echo "  MISSING the maps package in <queries>"; fail=1
            fi
            if grep -q "QUERY_ALL_PACKAGES" <<< "$TREE"; then
              echo "  QUERY_ALL_PACKAGES is in the merged manifest; name one package instead"
              fail=1
            else
              echo "  ok   no QUERY_ALL_PACKAGES"
            fi
          fi

          SIZE=$(stat -c%s "$APK")
          echo "  APK size: $(( SIZE / 1048576 )) MB"
          # Poom approved roughly +17.7 MB for onnxruntime, and the models add
          # about 3.7 MB on top: 28 MB until 0.36. The identity check (0.37.0)
          # added SFace 9.9 MB, ML Kit's bundled face detector 8.5 MB and the
          # camera/ML Kit code, landing at ~44.8 MiB; Poom approved raising the
          # ceiling to 46 MB on 2026-09-23. Still tight on purpose: a runtime
          # upgrade or a stray dependency should fail here, not ship.
          # 2026-09-23 (0.40.0): dex and native libraries compressed again
          # (useLegacyPackaging), 52 MB -> ~29.4 MiB. The ceiling follows it
          # down, still under what Poom approved: the APK's size is what a
          # private repo's artifact storage would be billed on.
          # 2026-09-24 (0.53.0): Media3's ExoPlayer for the music and video
          # players, ~3 MB, took the APK past 34 MiB. Poom: raise it as needed,
          # with a number and a reason. 40 MiB: the players plus video's own
          # code with ~4 MiB to spare, still under the 46 MB Poom approved in
          # 0.37.0, and low enough that a stray library (the 22 MB ffmpeg
          # extension Poom ruled out) still fails here.
          # 2026-09-25 (0.60.0): LibVLC, built by us LGPL-only and arm64-only, plays
          # what Media3 cannot. Poom set the new ceiling at 120 MiB; codecprobe
          # measured LibVLC at about +22-24 MiB, so a stray library still fails here.
          if [ "$SIZE" -gt 125829120 ]; then
            echo "  APK is over 120 MiB — check packaging (useLegacyPackaging), LibVLC's build, the onnxruntime version and new dependencies"; fail=1
          fi

          exit $fail

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: phone-ai-kiosk-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          # An upper bound only. What keeps storage small is the next step,
          # which keeps the newest APKs however old they are — so the latest
          # APK is always there to download, even after a quiet week.
          retention-days: 30

      - name: Keep only the newest APKs
        # KEEP_APKS newest "phone-ai-kiosk-debug-apk" artifacts stay; older
        # ones are deleted. On main only: a pull request never deletes the
        # APKs main produced. A failure here never fails the build — the APK
        # above is already uploaded.
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_APKS: 3
        run: |
          ids=$(gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100&name=phone-ai-kiosk-debug-apk" \
                  --jq '.artifacts[] | select(.expired == false) | "\(.created_at) \(.id)"' | sort -r | awk 'NR > ENVIRON["KEEP_APKS"] {print $2}')
          count=0
          for id in $ids; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" && count=$((count + 1))
          done
          echo "deleted $count older APK artifact(s); kept the newest $KEEP_APKS"
