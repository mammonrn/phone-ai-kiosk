name: Wake word notebook

# The Colab notebook broke on its very first cell: openWakeWord v0.6.0 declares
# tflite-runtime as a hard dependency, and tflite-runtime has never published a
# wheel for Python 3.12, which is what Colab runs. Nothing in the repository
# would have caught that, because nothing in the repository ever installed it.
#
# So this does — on a runner, never on the VPS, where torch and speechbrain are
# gigabytes the box does not have the RAM to spare for.
#
# Installs and imports only, plus the audio parser run against every row shape
# `datasets` has ever produced — including a real torchcodec AudioDecoder, which
# is what broke the notebook the second time. No dataset download, no training.

on:
  push:
    branches:
      - main
    paths:
      - 'wakeword/**'
      - '.github/workflows/wakeword-deps.yml'
  pull_request:
    paths:
      - 'wakeword/**'
      - '.github/workflows/wakeword-deps.yml'
  workflow_dispatch:

jobs:
  imports:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      # Both, and 3.13 is the one that counts: Colab runs 3.13, which the path in
      # the traceback gave away (/usr/local/lib/python3.13/dist-packages) after
      # this workflow had been testing 3.12 and passing. 3.12 stays because the
      # VPS runs it and a second runner costs nothing.
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Clone openWakeWord v0.6.0
        # The same pinned tag the notebook clones. Not main: main has moved.
        run: |
          git clone --depth 1 --branch v0.6.0 \
            https://github.com/dscripka/openWakeWord.git "$RUNNER_TEMP/openWakeWord"

      - name: Install FFmpeg
        # torchcodec decodes through FFmpeg's shared libraries. The runner image
        # does not ship them — the first version of this step ran
        # `ffmpeg -version | head -1`, which printed "command not found" and
        # still exited 0, because the pipeline takes head's status. pipefail
        # below, so a missing FFmpeg fails here instead of surfacing later as an
        # unexplained OSError out of torchcodec.
        #
        # torchcodec 0.16 ships core4..core9, so FFmpeg majors 4-9. Ubuntu 24.04
        # is well inside that.
        run: |
          set -o pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Install what Colab already ships
        # The notebook deliberately does NOT install these: Colab has them, and
        # its torch is a build matched to its own CUDA — letting pip touch it can
        # swap in a CPU wheel and lose the GPU silently. A bare runner has none
        # of them, so CI stands them up instead.
        #
        # ALL THREE from the CPU index, in one resolve. torchcodec is a compiled
        # extension linked against one torch build, and PyPI's torchcodec is the
        # CUDA one: its image ops want libcudart.so.13 and libtorch_cuda.so, so
        # pairing it with a CPU torch fails to load with
        # "Could not load this library: libtorchcodec_image.so" — which is not an
        # audio problem at all, and cost a CI run to read properly. The +cpu
        # build has no CUDA to look for. Colab ships a matched CUDA pair, which
        # is why the notebook must not install any of these itself.
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet torch==2.11.0 torchaudio==2.11.0 torchcodec \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet numpy scipy scikit-learn pyyaml tqdm requests
          python -c "import torchcodec; print('torchcodec', torchcodec.__version__)"

      - name: Run the notebook's own pip lines
        # Read out of the .ipynb rather than copied here, so this cannot pass
        # while the notebook is broken.
        run: python wakeword/check_notebook_deps.py --clone "$RUNNER_TEMP/openWakeWord" --install

      - name: Import everything the notebook imports
        run: python wakeword/check_notebook_deps.py --clone "$RUNNER_TEMP/openWakeWord"

      - name: The notebook must still be a valid notebook
        run: |
          python - <<'PY'
          import ast, json, pathlib
          nb = json.loads(pathlib.Path("wakeword/train_saifon_colab.ipynb").read_text("utf-8"))
          assert nb["nbformat"] == 4, nb["nbformat"]
          checked = 0
          for i, cell in enumerate(nb["cells"]):
              assert cell["cell_type"] in ("code", "markdown"), i
              assert isinstance(cell["source"], list), i
              if cell["cell_type"] != "code":
                  continue
              source = "".join(cell["source"])
              # Cells with ! or % are IPython, not Python, and ast cannot read them.
              if any(line.lstrip().startswith(("!", "%")) for line in source.splitlines()):
                  continue
              ast.parse(source)
              checked += 1
          print(f"{len(nb['cells'])} cells, {checked} plain-python cells parsed")
          PY

  run-all:
    # The notebook itself, every cell, top to bottom, through a real Jupyter
    # kernel — what Colab's Run all does. `python -m openwakeword.train` runs
    # as __main__ twice (augment, then train), so its piper import, the
    # /content/saifon path, torchaudio.info, the 16-frame feature shape and
    # the ONNX export are all on this path. Seconds of synthetic audio, a
    # 4000-row fake ACAV file (never the real 17 GB), 60 training steps, CPU.
    name: run all (py3.13, torch 2.11 = Colab)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install FFmpeg
        run: |
          set -o pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Install what Colab already ships
        # Pinned to what Colab reported (torch 2.11.0, whose torchaudio has no
        # info()). CPU build: the runner has no GPU. The notebook installs
        # everything else itself with its own !pip lines.
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet torch==2.11.0 torchaudio==2.11.0 torchcodec \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet numpy nbclient nbformat ipykernel
          python -c "import torchaudio; print('torchaudio', torchaudio.__version__, 'info():', hasattr(torchaudio, 'info'))"

      - name: Make /content, like Colab
        run: sudo mkdir -p /content && sudo chown "$USER" /content

      - name: Run all
        run: python wakeword/ci_run_notebook.py

      - name: Keep the executed notebook
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: executed-notebook
          path: /content/executed.ipynb
          if-no-files-found: ignore
          retention-days: 7
